<g id="start"><rect x="330" y="135" width="420" height="86" rx="12" class="card "/>
<rect x="330" y="135" width="420" height="86" rx="12" class="pulse" style="animation-delay:0s"/>
<text x="346" y="154" class="tag">ENTRY</text>
<text x="346" y="178" class="name">Start LoomFlow</text>
<text x="346" y="197" class="detail">User supplies a task or an existing PR.</text>
</g>
<g id="requirement"><rect x="330" y="245" width="420" height="86" rx="12" class="card "/>
<rect x="330" y="245" width="420" height="86" rx="12" class="pulse" style="animation-delay:1s"/>
<text x="346" y="264" class="tag">01 · BUILD MODE</text>
<text x="346" y="288" class="name">Refine the requirement</text>
<text x="346" y="307" class="detail">Five Cs · resolve gaps with the user.</text>
<text x="346" y="324" class="detail">Record acceptance criteria and assumptions.</text>
</g>
<g id="size"><rect x="330" y="355" width="420" height="86" rx="12" class="card "/>
<rect x="330" y="355" width="420" height="86" rx="12" class="pulse" style="animation-delay:2s"/>
<text x="346" y="374" class="tag">02 · ORCHESTRATOR</text>
<text x="346" y="398" class="name">Size the change</text>
<text x="346" y="417" class="detail">Small / Normal / Major</text>
<text x="346" y="434" class="detail">Select the builder, reviewers, and effort.</text>
</g>
<g id="design"><rect x="330" y="465" width="420" height="86" rx="12" class="card "/>
<rect x="330" y="465" width="420" height="86" rx="12" class="pulse" style="animation-delay:3s"/>
<text x="346" y="484" class="tag" style="font-size:10px">03 · MAJOR FEATURE / REDESIGN / &gt;300 CODE LINES</text>
<text x="346" y="508" class="name">Draft the design</text>
<text x="346" y="527" class="detail">Builder opens a draft PR with the design.</text>
<text x="346" y="544" class="detail">Other builds go directly to Build + prove.</text>
</g>
<g id="design-review"><rect x="805" y="465" width="250" height="86" rx="12" class="card optional"/>
<rect x="805" y="465" width="250" height="86" rx="12" class="pulse" style="animation-delay:3s"/>
<text x="821" y="484" class="tag">DESIGN REVIEW</text>
<text x="821" y="508" class="name">Review the design</text>
<text x="821" y="527" class="detail">Revise once if needed.</text>
<text x="821" y="544" class="detail">Round 2 only for blockers.</text>
</g>
<g id="build"><rect x="330" y="575" width="420" height="86" rx="12" class="card "/>
<rect x="330" y="575" width="420" height="86" rx="12" class="pulse" style="animation-delay:4s"/>
<text x="346" y="594" class="tag">04 · BUILDER</text>
<text x="346" y="618" class="name">Build + prove</text>
<text x="346" y="637" class="detail">Implement the acceptance criteria.</text>
<text x="346" y="654" class="detail">Run checks and record the safety proof.</text>
</g>
<g id="pr"><rect x="330" y="685" width="420" height="86" rx="12" class="card "/>
<rect x="330" y="685" width="420" height="86" rx="12" class="pulse" style="animation-delay:5s"/>
<text x="346" y="704" class="tag">05 · BUILDER</text>
<text x="346" y="728" class="name">Open / ready the PR</text>
<text x="346" y="747" class="detail">Keep the Requirement block in the body.</text>
<text x="346" y="764" class="detail">Push the code and confirm the head SHA.</text>
</g>
<g id="existing"><rect x="25" y="685" width="250" height="86" rx="12" class="card "/>
<rect x="25" y="685" width="250" height="86" rx="12" class="pulse" style="animation-delay:0s"/>
<text x="41" y="704" class="tag">REVIEW MODE ENTRY</text>
<text x="41" y="728" class="name">Existing PR</text>
<text x="41" y="747" class="detail">Skip requirement and build.</text>
<text x="41" y="764" class="detail">Use the supplied PR.</text>
</g>
<g id="setup"><rect x="330" y="795" width="420" height="86" rx="12" class="card "/>
<rect x="330" y="795" width="420" height="86" rx="12" class="pulse" style="animation-delay:6s"/>
<text x="346" y="814" class="tag">06 · ORCHESTRATOR</text>
<text x="346" y="838" class="name">Verify PR setup</text>
<text x="346" y="857" class="detail">Open PR · correct head SHA</text>
<text x="346" y="874" class="detail">Clean PR worktree · fetch the base.</text>
</g>
<g id="triage"><rect x="330" y="905" width="420" height="86" rx="12" class="card "/>
<rect x="330" y="905" width="420" height="86" rx="12" class="pulse" style="animation-delay:7s"/>
<text x="346" y="924" class="tag">07 · ORCHESTRATOR</text>
<text x="346" y="948" class="name">Select the review tier</text>
<text x="346" y="967" class="detail">Scan only for eligible low-risk changes.</text>
<text x="346" y="984" class="detail">Sensitive paths or doubt require full.</text>
</g>
<g id="scan"><rect x="110" y="1015" width="380" height="86" rx="12" class="card "/>
<rect x="110" y="1015" width="380" height="86" rx="12" class="pulse" style="animation-delay:8s"/>
<text x="126" y="1034" class="tag">08A · SCAN</text>
<text x="126" y="1058" class="name">One quick reviewer</text>
<text x="126" y="1077" class="detail">No findings → checks. Findings → full R1.</text>
</g>
<g id="full"><rect x="590" y="1015" width="380" height="86" rx="12" class="card "/>
<rect x="590" y="1015" width="380" height="86" rx="12" class="pulse" style="animation-delay:8s"/>
<text x="606" y="1034" class="tag">08B · FULL</text>
<text x="606" y="1058" class="name">Two reviewers in parallel</text>
<text x="606" y="1077" class="detail">Reviewer A + B review the same head SHA.</text>
</g>
<g id="findings"><rect x="330" y="1125" width="420" height="86" rx="12" class="card "/>
<rect x="330" y="1125" width="420" height="86" rx="12" class="pulse" style="animation-delay:9s"/>
<text x="346" y="1144" class="tag">09 · ORCHESTRATOR</text>
<text x="346" y="1168" class="name">Assess review findings</text>
<text x="346" y="1187" class="detail">Only blocker and major findings.</text>
<text x="346" y="1204" class="detail">Required reviews must be posted.</text>
</g>
<g id="analyze"><rect x="805" y="1235" width="250" height="86" rx="12" class="card fix"/>
<rect x="805" y="1235" width="250" height="86" rx="12" class="pulse" style="animation-delay:10s"/>
<text x="821" y="1254" class="tag">10 · IF FINDINGS</text>
<text x="821" y="1278" class="name">Analyze + fix / rebut</text>
<text x="821" y="1297" class="detail">One analyzer handles findings</text>
<text x="821" y="1314" class="detail">and each failed CI check.</text>
</g>
<g id="round2"><rect x="805" y="1345" width="250" height="86" rx="12" class="card fix"/>
<rect x="805" y="1345" width="250" height="86" rx="12" class="pulse" style="animation-delay:11s"/>
<text x="821" y="1364" class="tag">11 · IF ROUND 1 CHANGES HEAD</text>
<text x="821" y="1388" class="name">Review round 2</text>
<text x="821" y="1407" class="detail">Review fixes and new commits.</text>
<text x="821" y="1424" class="detail">Check their callers. No R3.</text>
</g>
<g id="checks"><rect x="330" y="1345" width="420" height="86" rx="12" class="card "/>
<rect x="330" y="1345" width="420" height="86" rx="12" class="pulse" style="animation-delay:12s"/>
<text x="346" y="1364" class="tag">12 · NO OPEN FINDINGS</text>
<text x="346" y="1388" class="name">Reuse checks + verify CI</text>
<text x="346" y="1407" class="detail">Reuse passing checks for combined inputs.</text>
<text x="346" y="1424" class="detail">Stop at the first failed check.</text>
</g>
<g id="gate"><rect x="330" y="1455" width="420" height="86" rx="12" class="card "/>
<rect x="330" y="1455" width="420" height="86" rx="12" class="pulse" style="animation-delay:13s"/>
<text x="346" y="1474" class="tag">13 · TEST AND MERGE · ONCE</text>
<text x="346" y="1498" class="name">Run the merge gate</text>
<text x="346" y="1517" class="detail">Expected SHA · clean worktree · coverage</text>
<text x="346" y="1534" class="detail">Mergeable + clean · respect branch checks.</text>
</g>
<g id="merge"><rect x="330" y="1565" width="420" height="86" rx="12" class="card "/>
<rect x="330" y="1565" width="420" height="86" rx="12" class="pulse" style="animation-delay:14s"/>
<text x="346" y="1584" class="tag">14 · PASS</text>
<text x="346" y="1608" class="name">Merge the reviewed head</text>
<text x="346" y="1627" class="detail">Use --match-head-commit.</text>
<text x="346" y="1644" class="detail">No --admin, force, or gate retry.</text>
</g>
<g id="stop"><rect x="805" y="1565" width="250" height="86" rx="12" class="card stop"/>
<rect x="805" y="1565" width="250" height="86" rx="12" class="pulse" style="animation-delay:14s"/>
<text x="821" y="1584" class="tag">STOP · MANUAL HANDLING</text>
<text x="821" y="1608" class="name">Report and stop</text>
<text x="821" y="1627" class="detail">Open issues after round 2,</text>
<text x="821" y="1644" class="detail">failed gate, or failed checks.</text>
</g>
<g id="retro"><rect x="330" y="1675" width="420" height="86" rx="12" class="card "/>
<rect x="330" y="1675" width="420" height="86" rx="12" class="pulse" style="animation-delay:15s"/>
<text x="346" y="1694" class="tag">15 · EVERY EXIT</text>
<text x="346" y="1718" class="name">Record the retrospective</text>
<text x="346" y="1737" class="detail">Append outcome, models, and one lesson.</text>
<text x="346" y="1754" class="detail">This also applies to stops and failures.</text>
</g>
<text x="938" y="585" class="label" style="font-size:12px">Blocker after R2 → stop</text>
<text x="25" y="1801" class="caption">Supervised mode: approve the requirement, plan or design, and start of the gate.</text>
<text x="25" y="1826" class="caption">Major redesign series: user tests the feature branch before the final sync PR.</text>
<text x="25" y="1851" class="label">Source: docs/loomflow.md (canonical) · generated by scripts/generate-loomflow-diagram.py</text>
</svg>
